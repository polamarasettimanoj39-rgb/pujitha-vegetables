<!DOCTYPE html><html>
<head>
<title>Pujitha Vegetables</title><style>

body{
font-family:Arial;
margin:0;
background:#f3f3f3;
text-align:center;
}

header{
background:#2e8b57;
color:white;
padding:20px;
}

.search{
margin:20px;
}

.search input{
padding:10px;
width:250px;
}

.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:white;
width:180px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
padding:10px;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
}

.price{
color:#2e8b57;
font-weight:bold;
}

button{
background:#25D366;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.admin{
background:white;
max-width:400px;
margin:20px auto;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

footer{
background:#2e8b57;
color:white;
padding:20px;
}

</style></head><body><header><h1>🥕 Pujitha Vegetables</h1>
<p>Fresh Farm Vegetables</p>
<p>📍 Kothavalasa Mandal, Mangalapalem Junction</p></header><div class="search">
<input type="text" id="search" placeholder="Search vegetable..." onkeyup="searchVeg()">
</div><div class="grid" id="vegList"></div><div class="admin"><h3>Admin Login</h3><input type="password" id="adminPass" placeholder="Password">
<button onclick="login()">Login</button><div id="adminPanel" style="display:none"><h3>Update Price</h3><input id="vegName" placeholder="Vegetable Name">
<input id="vegPrice" placeholder="Price"><button onclick="updatePrice()">Update</button>

</div></div><footer><h3>📱 Order on WhatsApp</h3><p>9949867332</p></footer><script>

let vegetables=[

{name:"Tomato",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/8/89/Tomato_je.jpg"},
{name:"Potato",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/6/60/Potato.jpg"},
{name:"Onion",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/1/1b/Onions.jpg"},
{name:"Carrot",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/7/7e/Carrots.jpg"},
{name:"Brinjal",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/3/37/Brinjal.jpg"},
{name:"Cucumber",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/4/43/Cucumber.jpg"},
{name:"Cabbage",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/0/03/Cabbage_and_cross_section_on_white.jpg"},
{name:"Cauliflower",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/4/4c/Cauliflower.jpg"},
{name:"Green Chilli",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/5/5b/Chili_peppers.jpg"},
{name:"Spinach",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/2/21/Spinach.jpg"},
{name:"Bottle Gourd",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/4/4b/Calabash.jpg"},
{name:"Bitter Gourd",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/7/79/Bitter_melon.jpg"},
{name:"Ridge Gourd",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/5/59/Luffa_acutangula.jpg"},
{name:"Pumpkin",price:"",img:"https://upload.wikimedia.org/wikipedia/commons/5/5c/Pumpkin.jpg"}

]

let saved=JSON.parse(localStorage.getItem("vegPrices"))

if(saved){
vegetables=saved
}

function showVegetables(list=vegetables){

let container=document.getElementById("vegList")

container.innerHTML=""

list.forEach(v=>{

let card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img src="${v.img}">
<h3>${v.name}</h3>
<p class="price">₹ ${v.price || "___"} / kg</p>

<button onclick="order('${v.name}')">Order</button>

`

container.appendChild(card)

})

}

function searchVeg(){

let text=document.getElementById("search").value.toLowerCase()

let filtered=vegetables.filter(v=>v.name.toLowerCase().includes(text))

showVegetables(filtered)

}

function order(item){

let message="Hello I want to order "+item

let url="https://wa.me/919949867332?text="+encodeURIComponent(message)

window.open(url,"_blank")

}

function login(){

let pass=document.getElementById("adminPass").value

if(pass==="1234"){

document.getElementById("adminPanel").style.display="block"

alert("Admin login successful")

}
else{

alert("Wrong password")

}

}

function updatePrice(){

let name=document.getElementById("vegName").value
let price=document.getElementById("vegPrice").value

vegetables.forEach(v=>{

if(v.name.toLowerCase()==name.toLowerCase()){

v.price=price

}

})

localStorage.setItem("vegPrices",JSON.stringify(vegetables))

showVegetables()

}

showVegetables()

</script></body>
</html>
